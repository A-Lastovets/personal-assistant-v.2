<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Document{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'styles.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'SudoTeam.ico' %}">
    <link rel="stylesheet" href="{% static 'pagination.css' %}">
    <link rel="stylesheet" href="{% static 'contacts_app/add_contact.css' %}">
    <link rel="stylesheet" href="{% static 'contacts_app/contacts_list.css' %}">
    <link rel="stylesheet" href="{% static 'files_app/files_app.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Moderustic:wght@300..800&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #3D6657;
            color: #E2B29B;
        }

        .navbar {
            background-color: #155840;
            color: #E2B29B;
        }
        
        .navbar-brand {
            color: #81BDA8;
        }

        .navbar .btn {
            background-color: #E2B29B;
            color: #155840;
            border: none;
        }

        .navbar .btn-danger {
            background-color: #CA825F;
            border: none;
        }

        @media (max-width: 767px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .navbar-brand {
                font-size: 1.5rem;
                margin-bottom: 10px;
            }

            .navbar-text {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
            }

            .navbar-text .btn {
                width: 90%;
                margin-bottom: 10px;
                padding: 12px 0;
                font-size: 1rem;
            }

            .navbar-text .btn:hover {
                background-color: #C69C6D;
            }

            .currency-section {
                order: -1;
                padding: 10px;
                background-color: #155840;
                color: #E2B29B;
                text-align: left;
                font-size: 0.9rem;
            }

            .news-section {
                padding-top: 20px;
                margin-top: 40px;
            }
        }

        @media (min-width: 768px) {
            .navbar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .navbar-nav {
                display: flex;
                justify-content: flex-end;
            }

            .navbar-nav .nav-item {
                margin-left: 15px;
            }

            .navbar-text {
                display: flex;
                align-items: center;
            }

            .navbar-text .btn {
                margin-left: 10px;
            }

            .currency-section {
                text-align: left;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand" href="{% url 'home' %}">PA</a>
        <div class="navbar-text ml-auto">
            {% if user.is_authenticated %}
                <a href="{% url 'users:profile' %}" class="btn btn-primary">Profile</a>
                <a href="{% url 'contact_home' %}" class="btn btn-primary">Contacts</a>
                <a href="{% url 'note_home' %}" class="btn btn-primary">Notes</a>
                <a href="{% url 'file_list' %}" class="btn btn-primary">Cloud storage</a>
                <a href="{% url 'users:logout' %}" class="btn btn-danger">Log out</a>
            {% else %}
                <a href="{% url 'users:login' %}" class="btn btn-primary">Login</a>
                <a href="{% url 'users:signup' %}" class="btn btn-primary" style="margin-left: 10px;">Sign up</a>
            {% endif %}
        </div>
    </nav>
    
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
