{% extends "base.html" %}

{% block content %}
<div class="card" style="background-color: #3D6657; color: #E2B29B;">
    <div class="card-header" style="background-color: #155840; color: #E2B29B;">
        <h2 class="text-center">Password changed successfully</h2>
    </div>
    <div class="card-body text-center">
        <p>Your password has been updated successfully</p>
        <a href="{% url 'users:login' %}" class="btn btn-primary" style="background-color: #6FBDA2; border: none;">Log In</a>
    </div>
</div>

<style>
    .btn {
        width: 100%;
        padding: 10px;
    }

    @media (max-width: 768px) {
        .card {
            margin: 10px;
        }

        .card-body p {
            font-size: 1rem;
        }
    }
</style>

{% endblock %}
