{% extends 'base.html' %}

{% block title %}Password reset form{% endblock %}

{% block content %}
<div class="card" style="background-color: #3D6657; color: #E2B29B;">
    <div class="card-header" style="background-color: #155840; color: #E2B29B;">
        <h2 class="text-center">Password reset form</h2>
    </div>
    <div class="card-body text-center">
        <p>We have sent password reset instructions to your email.</p> 
        <p>Please check your email.</p>
    </div>
</div>

<style>
    @media (max-width: 768px) {
        .card {
            margin: 10px;
        }

        .card-body {
            padding: 15px;
        }

        .card-header h2 {
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
        }

        .form-group p {
            font-size: 1rem;
        }
    }
</style>

{% endblock %}
